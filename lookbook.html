<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lookbook | Anshkriti Fashion</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        /*
         * GLIME Lookbook Integration
         * Only the Lookbook content area is controlled by GLIME.
         * Existing Anshkriti navigation/design remains untouched.
         */

        .glime-lookbook-section {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #glime-lookbook {
            width: 100%;
            min-height: 900px;
        }
    </style>
</head>

<body>

    <!-- ==============================
         ANSHKRITI HEADER
    =============================== -->

    <header class="navbar">

        <div class="logo">
            <h1>अnshकृति</h1>
        </div>

        <a href="index.html" class="back-link">
            ← Back to Order Form
        </a>

        <a href="quiz.html" class="back-link">
            Take Style Quiz
        </a>

    </header>


    <!-- ==============================
         ANSHKRITI LOOKBOOK HEADER
    =============================== -->

    <section class="lookbook-header">

        <h2>Our Creations & Client Diaries</h2>

        <p>
            Explore our premium collections, designs,
            block prints and latest creations.
        </p>

    </section>


    <!-- ==============================
         GLIME LOOKBOOK
    =============================== -->

    <section class="glime-lookbook-section">

        <div id="glime-lookbook"></div>

    </section>


    <!-- ==============================
         GLIME LOOKBOOK ENGINE
    =============================== -->

    <script
        src="https://glime.online/lookbook-engine.js?v=2"
        data-target="glime-lookbook"
        data-min-height="1000px">
    </script>


</body>
</html>
